<main class="page"><section class="card"><h1>Real-Time Fraud Alert Dashboard</h1><p>SSE Status: <strong>{{streamStatus}}</strong></p><form [formGroup]="form" (ngSubmit)="submit()" class="form"><label>Account <input formControlName="accountId"></label><label>Amount <input type="number" formControlName="amount"></label><label>Merchant <input formControlName="merchant"></label><label>Location <input formControlName="location"></label><button type="submit">Submit Transaction</button></form><p>{{submitMessage}}</p></section><section class="card"><h2>Live Alerts</h2><table><thead><tr><th>Risk</th><th>Account</th><th>Amount</th><th>Merchant</th><th>Location</th><th>Reason</th><th>Time</th></tr></thead><tbody><tr *ngFor="let a of alerts" [class.highlight]="a.highlighted"><td><span class="badge" [ngClass]="badgeClass(a.riskLevel)">{{a.riskLevel}}</span></td><td>{{a.accountId}}</td><td>{{a.amount | currency}}</td><td>{{a.merchant}}</td><td>{{a.location}}</td><td>{{a.reason}}</td><td>{{a.evaluatedAt | date:'mediumTime'}}</td></tr></tbody></table></section></main>
